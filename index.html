<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQOSYS Vault verifier</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  html { background: #000; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #fff; background: #000; }
  header { margin-bottom: 1.5rem; }
  header img { display: block; height: 56px; width: auto; }
  h1 { color: #fff; font-size: 1.6rem; margin: .75rem 0 .25rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=text] { width: 100%; padding: .4rem; }
  /* The IQOSYS platform button, primary variant: 40 px high, 16 px icon on the left, 12 px around it, filled blue. */
  button { display: inline-flex; align-items: center; gap: 12px; height: 40px; margin-top: 1.25rem; padding: 0 16px 0 10px; border: 2px solid #2563eb; border-radius: 8px; background: #2563eb; color: #fff; font: 600 14px/1 system-ui, sans-serif; white-space: nowrap; cursor: pointer; transition: background-color .15s, border-color .15s; }
  button:hover { background: #1d4ed8; border-color: #1d4ed8; }
  button:focus-visible { outline: none; box-shadow: 0 0 0 1px #000, 0 0 0 3px #60a5fa; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button svg { width: 16px; height: 16px; flex: none; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: .6rem; align-items: flex-start; padding: .4rem .6rem; border-left: 4px solid; margin: .3rem 0; word-break: break-all; }
  li.ok { border-color: #16a34a; } li.fail { border-color: #dc2626; }
  li img { width: 22px; height: 22px; flex: none; margin-top: .1rem; }
  small { color: #9ca3af; display: block; }
  #verdict { font-size: 1.3rem; font-weight: 700; }
</style>
</head>
<body>
<header>
  <img src="assets/iqosys-logo-white.png" alt="IQOSYS" width="224" height="56">
  <h1>Vault verifier</h1>
</header>
<p>Checks an IQOSYS proof of origin with SHA-256 and a public Polygon node only. Your file is read in this page and never sent anywhere; no IQOSYS server is contacted.</p>

<label for="file">Registered document or sealed PDF</label>
<input id="file" type="file">
<label for="proof">Public proof (iqosys-proof-....json), not needed for a sealed PDF</label>
<input id="proof" type="file" accept=".json,application/json">
<label for="rpc">Polygon node (optional; public nodes are used otherwise)</label>
<input id="rpc" type="text" placeholder="https://...">
<button id="run" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 11 2 2 4-4"/><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Verify</span></button>

<p id="verdict" role="status"></p>
<ul id="checks"></ul>

<script type="module">
import { verify } from "./verifier.mjs";
const read = async (input) => (input.files[0] ? new Uint8Array(await input.files[0].arrayBuffer()) : undefined);
document.getElementById("run").addEventListener("click", async () => {
    const verdict = document.getElementById("verdict");
    const list = document.getElementById("checks");
    verdict.textContent = "Checking…";
    list.replaceChildren();
    try {
        const proofBytes = await read(document.getElementById("proof"));
        const result = await verify({
            file: await read(document.getElementById("file")),
            proof: proofBytes ? JSON.parse(new TextDecoder().decode(proofBytes)) : undefined,
            rpcUrl: document.getElementById("rpc").value.trim() || undefined,
        });
        for (const { ok, label, detail } of result.checks) {
            const item = document.createElement("li");
            item.className = ok ? "ok" : "fail";
            const icon = document.createElement("img");
            icon.src = ok ? "assets/check.png" : "assets/cross.png";
            icon.alt = ok ? "Passed" : "Failed";
            const text = document.createElement("div");
            text.textContent = label;
            if (detail) {
                const small = document.createElement("small");
                small.textContent = detail;
                text.append(small);
            }
            item.append(icon, text);
            list.append(item);
        }
        verdict.textContent = result.ok ? "Verified: every check passed." : "Not verified: see the failed checks.";
    } catch (error) {
        verdict.textContent = `Error: ${error.message}`;
    }
});
</script>
</body>
</html>
